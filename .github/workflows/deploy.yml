name: Deploy Azure Function

on:
#  push:
#    branches:
#      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required to checkout code

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PowerShell
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Prepare deployment package
      run: |
        echo "Creating deployment package..."
        # Create a temporary directory for the deployment
        mkdir -p deployment
        
        # Copy function app files (exclude .git, .github, and other non-essential files)
        cp -r recordh deployment/
        cp host.json deployment/
        cp profile.ps1 deployment/
        cp requirements.psd1 deployment/
        
        # Create deployment zip
        cd deployment
        zip -r ../deploy.zip .
        cd ..
        
        echo "Deployment package created: deploy.zip"
        ls -lh deploy.zip

    - name: Deploy to Azure Function App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
        package: deploy.zip

    - name: Configure Function App Settings
      run: |
        echo "Configuring application settings..."
        az functionapp config appsettings set \
          --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --settings \
            ENTRA_CLIENT_ID="${{ secrets.ENTRA_CLIENT_ID }}" \
            ENTRA_TENANT_ID="${{ secrets.ENTRA_TENANT_ID }}" \
            ENTRA_AUDIENCE="${{ secrets.ENTRA_AUDIENCE }}" \
            ENTRA_CLIENT_SECRET="${{ secrets.ENTRA_CLIENT_SECRET }}" \
            REQUIRED_SCOPE="${{ secrets.REQUIRED_SCOPE }}" \
            FUNCTIONS_WORKER_RUNTIME="powershell" \
            FUNCTIONS_WORKER_RUNTIME_VERSION="7.2"

    - name: Verify Deployment
      run: |
        echo "Deployment completed successfully!"
        echo "Function App: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}"
        echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
        
        # Get function app URL
        FUNCTION_URL=$(az functionapp show \
          --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query "defaultHostName" -o tsv)
        
        echo "Function App URL: https://${FUNCTION_URL}"
        echo "API Endpoint: https://${FUNCTION_URL}/api/recordh"

    - name: Azure Logout
      if: always()
      run: az logout
